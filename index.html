<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャッピー＆サリーのしあわせナビ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">

    <section class="card top-card" id="topArea">
      <img src="images/cs_birth-lasboss.png" class="top-image" alt="チャッピー＆サリー">

      <h1>チャッピー＆サリーの<br>しあわせナビ🌈</h1>

      <p class="lead">
        お誕生日から<br>
        あなたの星座と9マスを見て<br>
        今のしあわせヒントを受け取ろう🐶💕
      </p>

      <label for="birthdate">お誕生日を入れてね</label>
      <input type="date" id="birthdate">

      <button type="button" onclick="startDiagnosis()">診断する✨</button>
    </section>

    <section id="resultArea" class="hidden">

      <div class="card">
        <h2>🌟あなたの星座</h2>
        <img id="zodiacImage" class="zodiac-image" alt="">
        <h3 id="zodiacName"></h3>
        <p id="zodiacText"></p>
      </div>

      <div class="card">
        <h2>🌿9マス診断</h2>

        <div class="grid">
          <div id="num1" class="cell">1</div>
          <div id="num2" class="cell">2</div>
          <div id="num3" class="cell">3</div>
          <div id="num4" class="cell">4</div>
          <div id="num5" class="cell">5</div>
          <div id="num6" class="cell">6</div>
          <div id="num7" class="cell">7</div>
          <div id="num8" class="cell">8</div>
          <div id="num9" class="cell">9</div>
        </div>

        <p class="small" id="numberText"></p>

        <h3 id="mainType"></h3>
        <p id="pitagorasText"></p>

        <div id="subTypes" class="sub-types"></div>
      </div>

      <div class="card">
        <h2>🐶今のラスボス</h2>
        <p id="bossText"></p>
      </div>

      <div class="card">
        <h2>✨しあわせヒント</h2>
        <p id="hintText"></p>
      </div>

      <div class="card">
        <p class="lead">
          もっとやさしく<br>
          自分を整理したい人へ🌿<br>
          セッションにも使えるマスター編はこちら🌈
        </p>

        <a href="https://ChappySally.base.shop/items/143814276" target="_blank" rel="noopener">
          <button type="button">マスター編をみてみる✨</button>
        </a>

        <button type="button" class="sub-button" onclick="resetDiagnosis()">もう一度見る🐾</button>
      </div>

    </section>

  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
