<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャッピー＆サリーのしあわせナビ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">

    <!-- 最初の選択画面 -->
    <section class="card top-card" id="menuArea">
      <img src="images/cs_birth-lasboss.png" class="top-image" alt="チャッピー＆サリー">

      <h1>チャッピー＆サリーの<br>しあわせナビ🌈</h1>

      <p class="lead">
        お誕生日から<br>
        今のしあわせヒントを受け取ろう🐶💕<br><br>
        自分の診断か<br>
        ふたりの相性診断を選んでね😊
      </p>

      <button type="button" onclick="openMyDiagnosis()">
        私の診断🌿
      </button>

      <button type="button" onclick="location.href='love.html'">
        相性診断💕
      </button>

      <button class="menuBackBtn"
onclick="location.href='https://chappy-sally.github.io/chappysally-menu/'">
🏠 しあわせメニューに戻る
      </button>
    </section>

    <!-- 私の診断画面 -->
    <section class="card top-card hidden" id="topArea">
      <img src="images/cs_birth-lasboss.png" class="top-image" alt="チャッピー＆サリー">

      <h1>チャッピー＆サリーの<br>しあわせナビ🌈</h1>

      <p class="lead">
        お誕生日から<br>
        あなたの星座と9マスを見て<br>
        今のしあわせヒントを受け取ろう🐶💕
      </p>

      <label for="birthdate">お誕生日を入れてね</label>
      <input type="date" id="birthdate">

      <button type="button" onclick="startDiagnosis()">診断する✨</button>

      <button type="button" class="sub-button" onclick="backToMenu()">
        戻る
      </button>

      <button class="menuBackBtn"
onclick="location.href='https://chappy-sally.github.io/chappysally-menu/'">
🏠 しあわせメニューに戻る
      </button>
    </section>

    <!-- 診断結果画面 -->
    <section id="resultArea" class="hidden">

      <div class="card">
        <h2>🌟あなたの星座</h2>
        <img id="zodiacImage" class="zodiac-image" alt="">
        <h3 id="zodiacName"></h3>
        <p id="zodiacText"></p>
      </div>

      <div class="card">
        <h2>🌿9マス診断</h2>

        <div class="grid">
          <div id="num1" class="cell">1</div>
          <div id="num2" class="cell">2</div>
          <div id="num3" class="cell">3</div>
          <div id="num4" class="cell">4</div>
          <div id="num5" class="cell">5</div>
          <div id="num6" class="cell">6</div>
          <div id="num7" class="cell">7</div>
          <div id="num8" class="cell">8</div>
          <div id="num9" class="cell">9</div>
        </div>

        <p class="small" id="numberText"></p>

        <h3 id="mainType"></h3>
        <p id="pitagorasText"></p>

        <div id="subTypes" class="sub-types"></div>
      </div>

      <div class="card">
        <h2>🐶今のテーマ</h2>
        <p id="bossText"></p>
      </div>

      <div class="card">
        <h2>✨しあわせヒント</h2>
        <p id="hintText"></p>
      </div>

      <div class="card">
        <p class="lead">
          もっとやさしく<br>
          安心にもどりたい人へ🌿<br>
          安心にもどるナビセットのご案内🌈
        </p>

        <a href="https://ChappySally.base.shop/items/151505728" target="_blank" rel="noopener">
          <button type="button">安心にもどるナビセットをみてみる✨</button>
        </a>

        <button type="button" class="sub-button" onclick="resetDiagnosis()">もう一度見る🐾</button>

        <button type="button" class="sub-button" onclick="backToMenuFromResult()">
          最初の画面に戻る🌈
        </button>

        <button class="menuBackBtn"
onclick="location.href='https://chappy-sally.github.io/chappysally-menu/'">
🏠 しあわせメニューに戻る
        </button>
      </div>

    </section>

  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>

  <script>
    function openMyDiagnosis(){
      document.getElementById("menuArea").classList.add("hidden");
      document.getElementById("topArea").classList.remove("hidden");
      document.getElementById("resultArea").classList.add("hidden");
      window.scrollTo(0,0);
    }

    function backToMenu(){
      document.getElementById("topArea").classList.add("hidden");
      document.getElementById("resultArea").classList.add("hidden");
      document.getElementById("menuArea").classList.remove("hidden");
      window.scrollTo(0,0);
    }

    function backToMenuFromResult(){
      document.getElementById("resultArea").classList.add("hidden");
      document.getElementById("topArea").classList.add("hidden");
      document.getElementById("menuArea").classList.remove("hidden");
      window.scrollTo(0,0);
    }
  </script>
</body>
</html>
